name: CI

on:
  push:
    branches: [main, "improve/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install "pytest>=8" "hypothesis>=6" "ruff>=0.5" "mypy>=1.10"
      - name: Tests
        run: python -m pytest
      - name: Ruff lint
        run: python -m ruff check scripts tests
      - name: Ruff format
        run: python -m ruff format --check scripts tests
      - name: Mypy
        run: python -m mypy
