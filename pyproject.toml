# Metadata only: this repo is not installable. The scripts in scripts/ are
# standalone modules run with python scripts/<name>.py, not an importable package.
[project]
name = "drive-shared-projects"
version = "0.2.0"
description = "Portable Drive-backed shared memory and governance for AI-assisted projects"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eduardo Ramos, CFA" }]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.isort]
known-first-party = [
    "common",
    "init_project",
    "build_index",
    "check_index",
    "check_sync",
    "check_drive",
]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "scripts"
files = ["scripts", "tests"]
